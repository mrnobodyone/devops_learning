---
- name: Библиотека python3-debian (нужна модулю deb822_repository)
  ansible.builtin.apt:
    name:
      - python3-debian
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Репозиторий HashiCorp
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: [deb]
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_facts.distribution_release }}"
    components: [main]
    signed_by: https://apt.releases.hashicorp.com/gpg
    state: present
  register: terraform_repo

- name: Обновить кэш apt после добавления репозитория
  ansible.builtin.apt:
    update_cache: true
  when: terraform_repo is changed

- name: Установить terraform
  ansible.builtin.apt:
    name: terraform
    state: present
