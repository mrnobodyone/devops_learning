---
- name: Установить базовые пакеты
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Задать таймзону
  community.general.timezone:
    name: "{{ common_timezone }}"

# --- swap (требование Kubernetes) ---
- name: Отключить swap в текущей сессии
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb > 0
  changed_when: true

- name: Закомментировать swap в /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

# --- ядро ---
- name: Загрузить модули ядра
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ common_kernel_modules }}"

- name: Загружать модули ядра при старте
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: "{{ common_kernel_modules | join('\n') }}\n"
    mode: "0644"

- name: Параметры sysctl для Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"

# --- SSH hardening ---
- name: Настройка конфига sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd